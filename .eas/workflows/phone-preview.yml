name: Re-Wired FM iPhone preview

on:
  workflow_dispatch: {}

defaults:
  tools:
    node: '24'

jobs:
  publish_ios_preview:
    name: Publish illustrative demo for Expo Go
    type: update
    environment: preview
    params:
      platform: ios
      branch: rewired-go-preview
      message: Re-Wired FM illustrative audio demo for Expo Go
    hooks:
      before_update:
        - name: Check TypeScript and content logic
          run: |
            npm run typecheck
            npm test

  verify_ios_preview:
    name: Verify published iOS bundle and audio files
    needs: [publish_ios_preview]
    environment: preview
    env:
      REWIRED_PREVIEW_UPDATES_JSON: ${{ needs.publish_ios_preview.outputs.updates_json }}
    steps:
      - uses: eas/checkout
      - name: Download and check every published asset
        run: node scripts/verify-expo-preview.mjs
